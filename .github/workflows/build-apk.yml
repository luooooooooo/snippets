name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build ${{ matrix.build_type }} APK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type:
          - debug
          - release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          accept-android-sdk-licenses: true
          packages: |
            platforms;android-36
            build-tools;36.0.0
            platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        if: matrix.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > snippets-release-key.jks

      - name: Build debug APK
        if: matrix.build_type == 'debug'
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: matrix.build_type == 'release'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PSNIPPETS_STORE_FILE=snippets-release-key.jks \
            -PSNIPPETS_STORE_PASSWORD="${STORE_PASSWORD}" \
            -PSNIPPETS_KEY_ALIAS="${KEY_ALIAS}" \
            -PSNIPPETS_KEY_PASSWORD="${KEY_PASSWORD}"

      - name: Collect APK
        id: collect-apk
        run: |
          mkdir -p upload
          APK_FILE=$(find app/build/outputs/apk/${{ matrix.build_type }} -name '*.apk' ! -name '*-unsigned.apk' | head -1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find app/build/outputs/apk/${{ matrix.build_type }} -name '*.apk' | head -1)
          fi
          cp "$APK_FILE" upload/
          echo "apk_file=upload/$(basename "$APK_FILE")" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.build_type }}
          path: upload/

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Snippets ${{ github.ref_name }}

            Fork 版本更新，基于 [kvelzer/snippets](https://github.com/kvelzer/snippets) 修改。

            ### 主要改动
            - 标签排序功能
            - 中文化界面
            - 多配色主题
            - 手势交互优化

            查看完整改动请访问 [Repository](https://github.com/${{ github.repository }}).
          files: |
            release-assets/*.apk
