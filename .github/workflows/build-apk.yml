name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-debug:
    name: Build Debug APK
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          accept-android-sdk-licenses: true
          packages: |
            platforms;android-36
            platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/

  build-release:
    name: Build Release APK
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          accept-android-sdk-licenses: true
          packages: |
            platforms;android-36
            platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > snippets-release-key.jks
            echo "Keystore decoded successfully"
          else
            echo "KEYSTORE_BASE64 not set, will use debug signing fallback"
          fi

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f snippets-release-key.jks ]; then
            ./gradlew assembleRelease \
              -PSNIPPETS_STORE_FILE=snippets-release-key.jks \
              -PSNIPPETS_STORE_PASSWORD="${STORE_PASSWORD}" \
              -PSNIPPETS_KEY_ALIAS="${KEY_ALIAS}" \
              -PSNIPPETS_KEY_PASSWORD="${KEY_PASSWORD}"
          else
            echo "No keystore, building with debug signing"
            ./gradlew assembleRelease
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Snippets ${{ github.ref_name }}

            Fork 版本更新，基于 [kvelzer/snippets](https://github.com/kvelzer/snippets) 修改。

            ### 主要改动
            - 标签排序功能
            - 中文化界面
            - 多配色主题
            - 手势交互优化

            查看完整改动请访问 [Repository](https://github.com/${{ github.repository }}).
          files: |
            release-assets/*.apk
