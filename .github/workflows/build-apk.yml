name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk

jobs:
  build:
    name: Build ${{ matrix.build_type }} APK
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type:
          - debug
          - release
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          echo "Installing Android SDK command-line tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d /tmp
          mkdir -p $ANDROID_HOME/cmdline-tools
          mv /tmp/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "Installing SDK packages..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "Android SDK setup complete."

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore (release only)
        if: matrix.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > snippets-release-key.jks
            echo "Keystore decoded successfully"
          else
            echo "KEYSTORE_BASE64 not set, will use debug signing"
          fi

      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ matrix.build_type }}" = "release" ] && [ -f snippets-release-key.jks ]; then
            ./gradlew assembleRelease \
              -PSNIPPETS_STORE_FILE=snippets-release-key.jks \
              -PSNIPPETS_STORE_PASSWORD="${STORE_PASSWORD}" \
              -PSNIPPETS_KEY_ALIAS="${KEY_ALIAS}" \
              -PSNIPPETS_KEY_PASSWORD="${KEY_PASSWORD}"
          else
            ./gradlew assemble${{ matrix.build_type == 'release' && 'Release' || 'Debug' }}
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.build_type }}
          path: app/build/outputs/apk/${{ matrix.build_type }}/

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Snippets ${{ github.ref_name }}

            Fork 版本更新，基于 [kvelzer/snippets](https://github.com/kvelzer/snippets) 修改。

            ### 主要改动
            - 标签排序功能
            - 中文化界面
            - 多配色主题
            - 手势交互优化

            查看完整改动请访问 [Repository](https://github.com/${{ github.repository }}).
          files: |
            release-assets/*.apk
